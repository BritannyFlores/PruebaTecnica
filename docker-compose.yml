services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=PruebaTecnica2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - prueba-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - prueba-network

  cliente-api:
    build:
      context: .
      dockerfile: src/Cliente.Service/Cliente.Api/Dockerfile
    container_name: cliente-api
    depends_on:
      - sqlserver
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ClienteConnection=Server=sqlserver;Database=ClienteDB;User Id=sa;Password=PruebaTecnica2026!;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
    ports:
      - "5001:8080"
    networks:
      - prueba-network

  cuenta-api:
    build:
      context: .
      dockerfile: src/Cuenta.Service/Cuenta.Api/Dockerfile
    container_name: cuenta-api
    depends_on:
      - sqlserver
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CuentaConnection=Server=sqlserver;Database=CuentaDB;User Id=sa;Password=PruebaTecnica2026!;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
    ports:
      - "5002:8080"
    networks:
      - prueba-network

networks:
  prueba-network:
    driver: bridge

volumes:
  sqlserver-data: